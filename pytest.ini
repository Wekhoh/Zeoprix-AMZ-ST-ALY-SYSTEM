[pytest]
norecursedirs =
    .pytest_tmp
    tasks/amz_pytest_tmp

# Coverage baseline (2026-04-24): 402 passed, 57% total.
# Backend core 83-95%，ui/pages Streamlit legacy 拖低总分
# （清理计划见 docs/ENGINEERING_BACKLOG.md § B）。
# 当前不设硬阈值以免阻塞 legacy 清理过程；CI 会上传 coverage.xml
# 供趋势追踪。
addopts =
    --tb=short

filterwarnings =
    ignore::DeprecationWarning:google.genai.types
