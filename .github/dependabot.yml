# Dependabot config — Sprint 5 · E.7
# Weekly security + minor version updates across all ecosystems.
# Major versions are NOT auto-opened (too noisy); reviewed manually.

version: 2
updates:
  # Python backend
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "python"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Frontend Next.js / React
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "frontend"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "deps"
      - "ci"
